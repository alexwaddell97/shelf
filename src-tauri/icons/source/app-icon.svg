  <rect x="8" y="48" width="48" height="4" fill="#bf8a52"/>
  <rect x="8" y="51" width="48" height="1" fill="#8f6236"/>
  <rect x="13" y="24" width="9" height="24" rx="0.8" fill="#f2b347"/>
  <rect x="13" y="28" width="9" height="2.5" fill="#b8801a"/>
  <rect x="23" y="15" width="11" height="33" rx="0.8" fill="#2f241c"/>
  <rect x="23" y="19" width="11" height="1.4" fill="#d9c9ad"/>
  <rect x="23" y="42.6" width="11" height="1.4" fill="#d9c9ad"/>
