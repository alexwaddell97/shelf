<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <!-- Shelf app icon: three hardbacks on an oak shelf, the last leaning on the tall one,
       on a warm paper tile that matches the light theme. The teal book is rotated 16°
       about its bottom-left corner, placed so its top-left corner meets the tall book's
       right edge (x = 34). Used for 48 px and up; 16–32 px use app-icon-small.svg. -->
