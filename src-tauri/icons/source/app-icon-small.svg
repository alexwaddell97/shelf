<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Shelf app icon, simplified for 16–32 px (taskbar, title bar): no bands, chunkier
       shapes, a thicker shelf and a slightly stronger tile edge so it holds up on a light
       taskbar. Same composition as app-icon.svg; the leaning book meets the tall book's
       edge (x = 36). -->
