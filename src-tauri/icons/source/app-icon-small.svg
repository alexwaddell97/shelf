  <rect x="7" y="47" width="50" height="6" fill="#b07a45"/>
  <rect x="12" y="23" width="11" height="24" fill="#f0a92e"/>
  <rect x="24" y="13" width="12" height="34" fill="#2f241c"/>
  <rect x="43.4" y="20" width="10" height="27" fill="#2ea595" transform="rotate(-16 43.4 47)"/>
</svg>
