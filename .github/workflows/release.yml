name: Release

# Builds installers for Windows, macOS (Apple Silicon and Intel) and Linux and attaches
# them to a draft GitHub release when a version tag (v0.2.0, ...) is pushed. It also
# writes latest.json, which installed copies check for updates.
#
# Needs repository secrets: TAURI_SIGNING_PRIVATE_KEY (the contents of
# ~/.tauri/shelf-updater.key) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty is fine, but
# the secret must exist). Without the key the build stops, because every update is signed.
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Shelf ${{ github.ref_name }}
          releaseBody: See the changelog for what's new.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          # Windows updates use the same NSIS installer people download.
          updaterJsonPreferNsis: true
